services:
  traefik:
    image: traefik:v3.5
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      # auto discovering of balanced nodes (docker provider)
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Traefik static config file
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml                                                                        
      # Traefik static provider config file
      - ./traefik/dynamic-conf.yml:/etc/traefik/dynamic-conf.yml  
    labels:
      # Node dynamic configuration using docker provider
      - "traefik.enable=true"
      # Define middlewares configuration
      - "traefik.http.middlewares.asn-ipallowed.ipallowlist.sourceRange=127.0.0.1/32,192.168.0.0/24"
    depends_on:
      - wwwserver #LB should await for starting front-end server
  
  wwwserver:
    image: traefik/whoami
    ports:
          - "80"
    # number of replicas
    scale: 2
    # limit container resources for testing
    cpus: .25
    mem_limit: 48m
    memswap_limit: 48m  # Swap not allowed if this value is equal to mem_limit

    labels:
      # Node dynamic configuration using docker provider and labels
      - "traefik.enable=true"
      - "traefik.http.routers.wwwserver.rule=PathPrefix(`/`)"
      # Apply middlewares definitions to container (comma separated)
#      - "traefik.http.routers.wwwserver.middlewares=asn-ipallowed"
