## Sample sonar-project.properties file

# Change projectkey with your project key in sonarqube server
sonar.projectKey=phpwebapp
## Config token and sonarqube-server host using properties or environment variables
#sonar.token=sqp_ac41dc06101bc25aef33efdb9d60b80c9d60ba36
#sonar.host.url=http://localhost:9000


# --- optional properties ---

# defaults to project key
#sonar.projectName=My project
# defaults to 'not provided'
#sonar.projectVersion=1.0
 
# Path is relative to the sonar-project.properties file. Defaults to .
#sonar.sources=src/main/java
#sonar.tests=src/test/java 
#sonar.java.binaries=target


# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8
