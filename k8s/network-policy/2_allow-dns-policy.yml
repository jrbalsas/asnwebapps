## Allow requests to internal DNS (for pods with label app: asn-app)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: asn-deny-internet-egress
spec:
  podSelector:
    matchLabels:
      app: asn-app  # apply rule only to pods with this label
  policyTypes:
  - Egress
  egress:
  # allow only DNS resolution from DNS pods in cluster
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchExpressions:
          - key: k8s-app
            operator: In
            values:
              - kube-dns        # cluster DNS pod
              - node-local-dns  # per node cache DNS pods in GKE clusters
    ports:
      - port: 53
        protocol: UDP
      - port: 53
        protocol: TCP
